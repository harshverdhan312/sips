model:
  name: SIPS Placement Predictor
  candidate_version: 2.0.0
  algorithm: XGBoost
  calibration: none
  decision_threshold: 0.5
features:
- Age
- Internships
- CGPA
- HistoryOfBacklogs
- Stream
excluded_features:
- Hostel
- Gender
best_parameters:
  classifier__subsample: 0.7
  classifier__reg_lambda: 5
  classifier__reg_alpha: 0.0
  classifier__n_estimators: 200
  classifier__min_child_weight: 1
  classifier__max_depth: 5
  classifier__learning_rate: 0.05
  classifier__colsample_bytree: 1.0
development_rows: 2542
historical_test_rows: 424
metrics:
  accuracy: 0.839623
  precision: 0.932292
  recall: 0.764957
  f1: 0.840376
  roc_auc: 0.908659
  pr_auc: 0.940752
  brier_score: 0.108907
  log_loss: 0.331664
  ece: 0.037461
  confusion_matrix:
    true_negative: 177
    false_positive: 13
    false_negative: 55
    true_positive: 179
