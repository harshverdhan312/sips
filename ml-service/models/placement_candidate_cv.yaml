purpose: Development-only placement model and feature comparison
selection_metric: mean group-CV ROC-AUC
random_state: 42
cross_validation: 5-fold StratifiedGroupKFold using each candidate's selected-feature
  profiles
dataset:
  total_rows: 2966
  training_rows: 2119
  validation_rows: 423
  development_rows: 2542
  deduplicated_development_rows: 965
  untouched_test_rows: 424
important_notes:
- The held-out test set was not used for candidate selection.
- Deduplication is reported only as a sensitivity analysis because the dataset has
  no student identifier.
- Predictive association does not establish causation or fairness.
